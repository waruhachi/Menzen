name: Build and Release Tweak

permissions:
    contents: read

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: macos-latest
        strategy:
            matrix:
                scheme: [rootful, rootless, roothide]
                include:
                    - scheme: rootful
                      scheme_arg: ""
                    - scheme: rootless
                      scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
                    - scheme: roothide
                      scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Theos
              uses: waruhachi/theos-action@4bab129cc00249d9cfea72726e967526a28a05fb # v2.6.5
              with:
                  theos-src: "waruhachi/theos"
                  theos-branch: "main"
                  sdks-src: "waruhachi/sdks"
                  sdks-branch: "main"

            - name: Build Package
              shell: bash
              run: |
                  make clean package ${{ matrix.scheme_arg }}

            - name: Upload DEB
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: ${{ matrix.scheme }}-package
                  path: packages/*.deb
